unbindall

bind_command '=' replay_speed_inc
bind_command '-' replay_speed_dec
bind_command 'NUM_PLUS' replay_speed_inc
bind_command 'NUM_MINUS' replay_speed_dec
bind_command 'BACKSPACE' replay_speed_rst
bind_command 'P' replay_pause

// Arrows: up/down - speed, left/right - 10 s back/forward (replay_seek_step); space - pause
bind_command 'UP' replay_speed_inc
bind_command 'DOWN' replay_speed_dec
bind_command 'LEFT' "replay_seek -10"
bind_command 'RIGHT' "replay_seek 10"
bind_command 'SPACE' replay_pause

bind show_statistics	'TAB'
bind !hide_statistics	'TAB'	 

bind cmd_cancel 'ESC'

exec spectator.cfg